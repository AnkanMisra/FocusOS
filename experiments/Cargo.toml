[package]
name = "focusos-experiments"
version = "0.1.0"
edition = "2021"
description = "Experiment runner for FocusOS agent strategy comparison"
authors = ["FocusOS Team"]

[[bin]]
name = "run-experiment"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Progress bars and terminal output
indicatif = "0.17"
colored = "3.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Statistics
statrs = "0.18"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
